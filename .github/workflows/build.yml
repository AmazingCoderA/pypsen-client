name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.20.1'
          - mc: '1.21.11'
          - mc: '26.3'
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Loom 1.19.4 itself needs Java 25; the bytecode level for each game
      # version is selected by build.gradle via -PmcTarget.
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build Minecraft ${{ matrix.mc }}
        run: ./gradlew build --no-daemon -PmcTarget=${{ matrix.mc }}

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypsen-${{ matrix.mc }}
          path: build/libs/pypsen-${{ matrix.mc }}-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: download all builds
        uses: actions/download-artifact@v4
        with:
          pattern: pypsen-*
          path: release-jars
          merge-multiple: true

      - name: publish release with all versions
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*.jar
          generate_release_notes: true
